name: Record Package Owners

on:
    push:
        branches: [master]
        paths:
            - "packages/**"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    record:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              working-directory: generator
              run: bun install

            - name: Record owners for new packages
              working-directory: generator
              env:
                  REPO: ${{ github.repository }}
                  GH_TOKEN: ${{ secrets.REGISTRY_BOT_TOKEN }}
              run: bun ./src/record-owners.ts
