name: Namespace Requests

on:
    issues:
        types: [opened]
    issue_comment:
        types: [created]

permissions:
    contents: write
    issues: write

concurrency:
    group: namespace-request-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    request:
        if: >-
            (github.event_name == 'issues' && contains(github.event.issue.body, '/request-namespace')) ||
            (github.event_name == 'issue_comment' &&
             (contains(github.event.comment.body, '!approve') || contains(github.event.comment.body, '@robolde')))
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              working-directory: generator
              run: bun install

            - name: Handle namespace request
              working-directory: generator
              env:
                  GH_TOKEN: ${{ secrets.REGISTRY_BOT_TOKEN }}
                  EVENT: ${{ github.event_name }}
                  REPO: ${{ github.repository }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  ISSUE_BODY: ${{ github.event.issue.body }}
                  ISSUE_AUTHOR_ID: ${{ github.event.issue.user.id }}
                  ISSUE_AUTHOR_LOGIN: ${{ github.event.issue.user.login }}
                  COMMENT_BODY: ${{ github.event.comment.body }}
                  COMMENT_AUTHOR_LOGIN: ${{ github.event.comment.user.login }}
                  COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
              run: |
                  bun ./src/namespace-request.ts
